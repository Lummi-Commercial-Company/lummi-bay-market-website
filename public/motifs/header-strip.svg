    <rect x="76" y="14" width="4" height="8" rx="2"/>
    <!-- salmon -->
    <path d="M118 12c8-7 22-8 30-1-8 7-22 8-30 1Z"/>
    <path d="M152 6l12 6-12 6z"/>
    <!-- wave -->
    <path d="M190 14c8-8 16 8 24 0s16 8 24 0 16 8 24 0v4c-8 8-16-8-24 0s-16-8-24 0-16-8-24 0z"/>
